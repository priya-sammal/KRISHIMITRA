<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Fertilizer Recommendation</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="main-wrap">
    <div class="card">
      <h1>Fertilizer Recommendation</h1>
      <p class="lead">Enter soil values and crop name</p>

      <div class="form-group">
        <label>Crop Name</label>
        <input type="text" id="crop" placeholder="e.g. Rice, Wheat" />
      </div>

      <div class="form-group">
        <label>Nitrogen (N)</label>
        <input type="number" id="nitrogen" value="50" />
      </div>

      <div class="form-group">
        <label>Phosphorus (P)</label>
        <input type="number" id="phosphorus" value="50" />
      </div>

      <div class="form-group">
        <label>Potassium (K)</label>
        <input type="number" id="potassium" value="50" />
      </div>

      <div class="actions">
        <button id="predictBtn" class="btn primary">Recommend</button>
        <button id="resetBtn" class="btn">Reset</button>
      </div>
    </div>

    <div class="card result-card">
      <h2>Result</h2>
      <div id="result">Enter values and click Recommend.</div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
